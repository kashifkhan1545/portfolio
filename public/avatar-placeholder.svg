<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="meshGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="36" fill="url(#bgGrad)" />
  <rect width="400" height="400" rx="36" fill="url(#meshGlow)" />

  <!-- Abstract Code Grid Pattern -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.5">
    <path d="M 50 0 L 50 400 M 100 0 L 100 400 M 150 0 L 150 400 M 200 0 L 200 400 M 250 0 L 250 400 M 300 0 L 300 400 M 350 0 L 350 400" />
    <path d="M 0 50 L 400 50 M 0 100 L 400 100 M 0 150 L 400 150 M 0 200 L 400 200 M 0 250 L 400 250 M 0 300 L 400 300 M 0 350 L 400 350" />
  </g>

  <!-- Outer Neon Glow Border -->
  <rect x="6" y="6" width="388" height="388" rx="32" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.85" />

  <!-- Tech Geometric Hex Ring Background -->
  <circle cx="200" cy="180" r="115" fill="none" stroke="url(#glowGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="200" cy="180" r="130" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.3"/>

  <!-- Developer Silhouette -->
  <!-- Body/Torso -->
  <path d="M 100 360 C 105 285, 145 260, 200 260 C 255 260, 295 285, 300 360 Z" fill="#1e293b" />
  <path d="M 120 360 C 125 295, 155 272, 200 272 C 245 272, 275 295, 280 360 Z" fill="#334155" opacity="0.8" />
  <!-- Collar / Shirt V-neck -->
  <path d="M 180 270 L 200 305 L 220 270 Z" fill="#475569" />

  <!-- Head & Neck -->
  <rect x="182" y="220" width="36" height="45" rx="6" fill="#475569" />
  <!-- Head shape -->
  <ellipse cx="200" cy="170" rx="55" ry="65" fill="#334155" />
  <!-- Hair / Styling -->
  <path d="M 142 165 C 142 110, 165 95, 200 95 C 235 95, 258 110, 258 165 C 255 130, 240 115, 200 115 C 160 115, 145 130, 142 165 Z" fill="#1e293b" />
  <!-- Modern Glasses / Tech Specs -->
  <rect x="162" y="152" width="32" height="20" rx="6" fill="none" stroke="#38bdf8" stroke-width="3" />
  <rect x="206" y="152" width="32" height="20" rx="6" fill="none" stroke="#38bdf8" stroke-width="3" />
  <line x1="194" y1="162" x2="206" y2="162" stroke="#38bdf8" stroke-width="3" />
  <line x1="150" y1="160" x2="162" y2="160" stroke="#38bdf8" stroke-width="2.5" />
  <line x1="238" y1="160" x2="250" y2="160" stroke="#38bdf8" stroke-width="2.5" />

  <!-- Floating Code Badges / Tech Orbits -->
  <!-- Left Badge: React / Code -->
  <g transform="translate(45, 120)">
    <circle cx="24" cy="24" r="24" fill="#0f172a" stroke="#06b6d4" stroke-width="2" filter="url(#glow)"/>
    <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- Right Badge: Mobile / Flutter / React Native -->
  <g transform="translate(305, 120)">
    <circle cx="24" cy="24" r="24" fill="#0f172a" stroke="#a855f7" stroke-width="2" filter="url(#glow)"/>
    <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#c084fc" text-anchor="middle">📱</text>
  </g>

  <!-- Bottom Floating Badge: Full-Stack / AI -->
  <g transform="translate(140, 325)">
    <rect width="120" height="34" rx="17" fill="#090d16" stroke="url(#accentGrad)" stroke-width="2" />
    <circle cx="22" cy="17" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="70" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">FULL-STACK</text>
  </g>
</svg>

